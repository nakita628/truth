name: Test

# Every check a change must pass, on every push to main and every pull request. release.yml
# runs after this workflow has passed on main, and calls it first in a run started on main (the
# one that publishes the Version Packages merge, which starts no Test run of its own).
#
# Action versions are tracked by Renovate, which pins each one to its digest
# (helpers:pinGitHubActionDigests) and keeps the @vX.Y.Z tag as a comment.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call: {}

# Nothing is granted by default; each job asks for exactly what it needs.
permissions: {}

# Only the tip of a branch or pull request is worth testing, so a push that supersedes an
# earlier one cancels its run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint the repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # the checkout, nothing else
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: '24'
          cache: true

      - run: vp install --frozen-lockfile

      # Formatting is the one repo-wide code check that stays outside Bazel: oxfmt runs over
      # every file at once from the root config.
      - run: vp fmt --check

      # Every text check in one task, the same `pnpm lint` a contributor runs: Markdown
      # structure, terminology, spelling, secret scanning, workflow syntax (actionlint), the
      # workflows' security audit (zizmor, pinned in lint/zizmor.mjs, through the runner's
      # pipx; suppressions live in .github/zizmor.yml), unused code and link rot. Nothing here
      # needs a build. The token is the job's read-only one; zizmor uses it for its online
      # audits (known-vulnerable and impostor action commits).
      - run: vp run lint
        env:
          GH_TOKEN: ${{ github.token }}

      # oas-truth imports schema-truth through its published entry points (dist/), so the
      # type-aware lint below needs the sibling built first.
      - run: vp run schema-truth#build

      # Type-aware oxlint and the type check of every package (`vp check`). It runs here
      # rather than under Bazel because oxfmt skips symlinked files, and a Bazel runfiles tree
      # is nothing but symlinks.
      - run: vp run --filter './npm/*' check

  test:
    name: Build, type-check and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # the checkout, nothing else
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Bazelisk ships on the hosted runner as `bazel` and reads .bazelversion. The cache
      # holds the fetched rules, the Node toolchain and the npm packages, keyed on the two
      # lockfiles that decide them; the action cache inside it is what makes an unchanged
      # package a cache hit instead of a rerun.
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/bazel
          key: ${{ runner.os }}-bazel-${{ hashFiles('MODULE.bazel.lock', 'pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-bazel-

      # Every package: `vp pack`, `vp check` (type-aware lint and type check), `vp test`, and
      # the fixtures' type check of the generated output against the real target libraries.
      - run: bazel test //...
