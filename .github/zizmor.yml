# https://docs.zizmor.sh/configuration/
rules:
  dangerous-triggers:
    # The release chain is deliberately built on `workflow_run`: Test → release, so that a
    # publish can only ever come from a commit whose test run already passed. The workflow is
    # guarded — `permissions: {}` at the top, an `if` on every job that requires
    # `conclusion == 'success'` and `event == 'push'` (so only code already on main runs) or,
    # in the run the merge job starts on main, the `test` job's success; the publish and
    # release checkouts pinned to the commit Test passed on; and the jobs that may write a
    # branch or merge the Version Packages pull request kept apart from the job that holds the
    # npm OIDC token.
    ignore:
      - release.yml
